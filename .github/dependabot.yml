version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'vitest', '@vitest/*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
