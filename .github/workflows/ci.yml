name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is free feedback; superseding a run on main
  # would lose the only record that a merged commit is good.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  layout:
    name: Layout
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      # Chromium is ~150 MB and the pinned version only changes when the
      # Playwright dependency does, so the lockfile is the cache key.
      - name: Restore the browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The system libraries are apt packages rather than part of the cache,
      # so they are installed either way.
      - name: Install Chromium's system libraries
        run: pnpm exec playwright install-deps chromium

      # Only Chromium: these tests measure Chief's own layout, not how it
      # renders across engines, and the shipped webviews are not available
      # here. A restored cache makes this a no-op rather than a download.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Test
        run: pnpm test:e2e

      # The one action still on Node 20, and deliberately: its v5 is a Node 20
      # action too, so bumping it would buy nothing. It also only runs when the
      # job has already failed. Revisit when upload-artifact ships Node 24.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tauri
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  app:
    name: App build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows are the platforms nothing else compiles: the Rust
        # job already builds the whole crate on Linux, but `#[cfg(windows)]`
        # code — `engine.rs:325`, which is where the last two fixes on main
        # went — is compiled on Windows and nowhere else. So a pull request
        # builds those two, and main adds Linux, where the app build is the
        # only job that links a release profile against WebKitGTK.
        platform:
          ${{ fromJSON(github.event_name == 'pull_request' && '["macos-latest", "windows-latest"]' ||
          '["ubuntu-22.04", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      # Release restores this cache rather than compiling Chief's dependencies
      # again, which is why the key is shared rather than per-job. Saving is
      # left to main: a release-profile target directory per platform per open
      # branch would evict the caches everything else restores from.
      - uses: ./.github/actions/setup-tauri
        with:
          shared-key: tauri-${{ matrix.platform }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the desktop app
        run: pnpm tauri build --no-bundle
