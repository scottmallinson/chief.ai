name: CI

# Pull requests, and nothing else.
#
# `main` is not built here. A branch has to be up to date with `main` before it
# can merge, so the tree a pull request proves green is the tree the merge
# produces — running the same jobs again on the merge commit would be paying
# twice for an answer already given. And a release does not read this run: it
# runs the checks itself, against the commit it is about to bundle.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      build-app: true
