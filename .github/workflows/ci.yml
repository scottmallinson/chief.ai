name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is free feedback; superseding a run on main
  # would lose the only record that a merged commit is good.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  layout:
    name: Layout
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      # Chromium is ~150 MB and the pinned version only changes when the
      # Playwright dependency does, so the lockfile is the cache key.
      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The system libraries are apt packages rather than part of the cache,
      # so they are installed either way.
      - name: Install Chromium's system libraries
        run: pnpm exec playwright install-deps chromium

      # Only Chromium: these tests measure Chief's own layout, not how it
      # renders across engines, and the shipped webviews are not available
      # here. A restored cache makes this a no-op rather than a download.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Test
        run: pnpm test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tauri
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  app:
    name: App build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at ten times the Linux rate and Windows at twice,
        # so a pull request compiles on Linux only. The full matrix runs on
        # every push to main — before anything is ever released from it — and
        # on demand from the Actions tab for a branch that touches the parts
        # WebView2 or WKWebView would be the first to break.
        platform:
          ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04",
          "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tauri
        with:
          cache-key: ${{ matrix.platform }}

      - name: Build the desktop app
        run: pnpm tauri build --no-bundle
