name: Release

on:
  # Every merge to main, and on demand.
  #
  # This used to be `workflow_dispatch` alone, to spend fewer billed minutes on
  # the bundles a release builds. This repository is public and runs on
  # GitHub's standard runners, so those minutes are not billed at all — and
  # what the manual trigger actually cost was that `main` could sit for weeks
  # holding a fix nobody could download, because releasing was a thing somebody
  # had to remember rather than something that happened.
  #
  # Nothing here releases unconditionally. `scripts/release.mjs` still decides:
  # a merge carrying only `docs`, `ci`, `chore`, `style`, `test` or `refactor`
  # commits changes nothing a person can install, so it ends at the `version`
  # job with `releasing=false` and no bundle is built.
  #
  # The release commit is pushed with GITHUB_TOKEN, which by design raises no
  # workflow runs, so a release cannot trigger the next one.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: The branch or commit to release. Defaults to main.
        required: false
        default: main

concurrency:
  # Never cancelled, and never two at once: a release commits to main and moves
  # a tag, so a second run waits for the first rather than racing it.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Matches CI. Not cosmetic: rust-cache hashes every `CARGO_*` and `RUST*`
# variable into its key, so a workflow that sets this and one that does not
# would look like different environments and never share a cache.
env:
  CARGO_TERM_COLOR: always

jobs:
  # The same jobs a pull request runs, against the commit this release is about
  # to bundle — which is what makes "a release depends on CI being green" a
  # fact rather than a cross-reference. The app build is left out: the bundle
  # jobs below compile every platform anyway, in the profile that ships.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      build-app: false

  # One Linux job. It decides whether what has landed since the last tag is
  # worth releasing — most merges do not, which is what keeps a trigger on
  # every push from meaning a release on every push — and if it is, it is the
  # release: the version is written
  # into the five files that carry it, the changelog gains an entry, both are
  # committed back to main and tagged, and a draft release is opened for the
  # bundles to attach to.
  version:
    name: Work out the release
    # Nothing is released from a red commit.
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      releasing: ${{ steps.decide.outputs.releasing }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      id: ${{ steps.draft.outputs.id }}
    steps:
      # Full history and tags: the script releases what has landed since the
      # last `v*` tag, and cannot see that in a shallow clone.
      #
      # Whatever main holds when this run starts, not the commit that triggered
      # it. Two merges close together raise two runs, and the second one waits
      # on the concurrency group; releasing the triggering commit rather than
      # the branch would have the first run pushing a commit whose parent main
      # had already moved past, which is a non-fast-forward and a red release.
      # Releasing the branch means the first run carries both merges and the
      # second finds nothing left to release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}

      # No `pnpm install`: the script has no dependencies, so the runner's own
      # Node runs it and a release does not wait on a package manager.
      - name: Decide, and write the version in
        id: decide
        run: node scripts/release.mjs --write

      # Attributed to the Actions bot rather than to a person, because nobody
      # wrote this commit: `scripts/release.mjs` derived every line of it from
      # commits that already carry their own authors. It is also the identity
      # the token actually belongs to — the push is made with GITHUB_TOKEN —
      # so `git log` on main now says a release came from the automation, which
      # is what happened. Repository-meta only: it changes no contributor's
      # attribution, since a release commit contains nobody's code.
      #
      # The address is the fixed one GitHub associates with github-actions[bot];
      # it is not a mailbox and is not derived from this repository.
      - name: Commit and tag it
        id: commit
        if: steps.decide.outputs.releasing == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # website/support.js carries the version the download links are built
          # from, and website/changelog.html is generated from the changelog
          # this run just wrote. Both ship with the site, so both are part of
          # the release commit rather than a follow-up nobody remembers.
          git add package.json CHANGELOG.md src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock website/support.js website/changelog.html
          git commit -m "chore(repo): release $VERSION"

          # Pushed with GITHUB_TOKEN, which by design starts no further
          # workflow runs — so this commit does not set CI or this workflow off
          # again, and cannot loop.
          #
          # Something can still land on main while the checks run, and that
          # would make this a non-fast-forward: a release that is otherwise
          # finished, failing on the last push. The release commit touches the
          # version files and the changelog, which nothing but a release
          # writes, so it is replayed on top of what landed rather than
          # abandoned. What it replays onto is a merge that was green in its
          # own right.
          pushed=false

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "::notice::main moved; replaying the release commit (attempt $attempt)."
            git fetch origin main

            # A conflict here means something other than a release wrote one of
            # these files, which is a person's decision rather than a retry.
            git rebase origin/main || {
              git rebase --abort || true
              echo "::error::The release commit does not replay onto main. Release by hand."
              exit 1
            }
          done

          if [ "$pushed" != true ]; then
            echo "::error::main kept moving. Nothing was released, and nothing was tagged."
            exit 1
          fi

          # Tagged after the push, so the tag names the commit that is actually
          # on main rather than one a rebase has since replaced.
          git tag "$TAG"
          git push origin "$TAG"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A draft, so the tag's release exists for the bundles to attach to
      # without anyone being told about a release they cannot download yet.
      - name: Open the release
        id: draft
        if: steps.decide.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          NOTES: ${{ steps.decide.outputs.notes }}
          TARGET: ${{ steps.commit.outputs.sha }}
        run: |
          id=$(
            jq -n \
              --arg tag "$TAG" \
              --arg name "Chief $TAG" \
              --arg body "$NOTES" \
              --arg target "$TARGET" \
              '{tag_name: $tag, name: $name, body: $body, target_commitish: $target, draft: true}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" |
            jq -r '.id'
          )

          case "$id" in
            '' | null | *[!0-9]*)
              echo "::error::The release was not created, so there is nothing to attach bundles to."
              exit 1
              ;;
          esac

          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice::Drafted $TAG as release $id."

  bundle:
    name: Bundle (${{ matrix.label }})
    needs: version
    if: needs.version.outputs.releasing == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS builds both architectures, and both run on the same arm64
        # runner — so each names the engine it needs. `engine-target` is not
        # decoration: the Intel bundle links an Intel `llama-server`, and
        # fetching the runner's own would leave Tauri looking for a sidecar
        # that is not there.
        #
        # Linux builds on its own runner and needs no `engine-target`, because
        # the machine it builds on is the machine it builds for. One x64 build,
        # packaged three ways by `bundle.targets: all` — .AppImage, .deb and
        # .rpm — which is one compile rather than three.
        include:
          - platform: macos-latest
            label: macOS Apple silicon
            args: --target aarch64-apple-darwin
            engine: aarch64-apple-darwin
            assets: Chief_VERSION_aarch64.dmg
          - platform: macos-latest
            label: macOS Intel
            args: --target x86_64-apple-darwin
            engine: x86_64-apple-darwin
            assets: Chief_VERSION_x64.dmg
          - platform: windows-latest
            label: Windows
            args: ''
            engine: ''
            assets: Chief_VERSION_x64-setup.exe
          # 22.04 rather than latest, deliberately: an AppImage and a .deb link
          # against the glibc and the WebKitGTK of the machine that built them,
          # so building on the newest runner would quietly refuse to start on
          # anything older. The oldest runner GitHub still offers is the widest
          # audience this can reach.
          - platform: ubuntu-22.04
            label: Linux
            args: ''
            engine: ''
            assets: |
              Chief_VERSION_amd64.AppImage
              Chief_VERSION_amd64.deb
              Chief-VERSION-1.x86_64.rpm
    steps:
      # The release commit, not whatever main has reached since: another pull
      # request merging mid-release must not change what ships.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      # A missing variable would silently produce a binary whose "Connect
      # GitHub" button never works, and nobody would find out until after they
      # had installed it. Checked before anything is compiled, so the matrix
      # fails in seconds rather than after every bundle.
      - name: Check the GitHub client id is configured
        shell: bash
        env:
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CHIEF_GITHUB_CLIENT_ID" ]; then
            echo "::error::CHIEF_GITHUB_CLIENT_ID is not set. Add it under Settings → Secrets and variables → Actions → Variables, or sign-in will be broken in this release."
            exit 1
          fi
          echo "Client id is configured (${#CHIEF_GITHUB_CLIENT_ID} characters)."

      # The same cache CI's app build writes from main, so a release starts
      # with Chief's dependencies already compiled instead of building the
      # whole tree from nothing. Only dependencies: rust-cache leaves the
      # workspace's own crates out, so Chief itself is always compiled here.
      # Keyed on the target rather than the runner, because the two macOS jobs
      # run on the same runner and compile different architectures into
      # different target directories. Sharing one key had them overwriting each
      # other's cache with artifacts the other cannot use.
      - uses: ./.github/actions/setup-tauri
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          engine-target: ${{ matrix.engine }}
          shared-key: tauri-${{ matrix.engine || matrix.platform }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux only, and only for the AppImage. linuxdeploy walks every ELF
          # in the AppDir and refuses to build a bundle whose dependencies it
          # cannot resolve — and Tauri's Linux layout puts the sidecar in
          # `usr/bin` while its 38 llama.cpp libraries go to `usr/lib/Chief`,
          # so `llama-server`'s own `RUNPATH=$ORIGIN` resolves to a directory
          # none of them are in. Chief sets the loader path itself before it
          # spawns the server (`engine::library_dirs`), so the installed app is
          # fine; linuxdeploy cannot know that, and stops with
          # `Could not find dependency: libllama-server-impl.so` after the
          # whole crate has been compiled in release. Pointing it at the
          # fetched libraries lets it resolve them and deploy them itself.
          LD_LIBRARY_PATH: ${{ matrix.platform == 'ubuntu-22.04' && format('{0}/src-tauri/binaries/lib', github.workspace) || '' }}
          # Baked into the binary so nobody has to configure anything to sign
          # in. A device-flow client id is not a secret, which is why this is a
          # repository variable rather than a secret.
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
          # And checked again from inside the compilation. The step above
          # proves the variable is set; only `build.rs` can prove the value
          # reached the compiler, which is the gap a stale build fingerprint
          # fits through and the one a user finds by pressing Connect.
          CHIEF_REQUIRE_CLIENT_ID: '1'
        with:
          releaseId: ${{ needs.version.outputs.id }}
          args: ${{ matrix.args }}

      # The site links to these files by name, built from a version constant in
      # `website/support.js` — it makes no request to GitHub to find out what a
      # release actually contains, because that would hand every visitor's IP
      # address to GitHub on page load. The cost of that is that a bundler
      # renaming its output turns every download button on the site into a 404,
      # silently, with nothing on either side to notice.
      #
      # So the names are checked here, against the files that were just built,
      # while the release is still a draft. A mismatch stops `publish` and
      # leaves the draft sitting there with its assets — which is the failure
      # this workflow is already shaped around — rather than announcing a
      # release whose download links do not work.
      - name: Check the bundles are named what the site links to
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ASSETS: ${{ matrix.assets }}
        run: |
          missing=0

          while read -r template; do
            [ -n "$template" ] || continue
            expected=${template//VERSION/$VERSION}

            if find src-tauri/target -type f -name "$expected" | grep -q .; then
              echo "Found $expected"
            else
              echo "::error::$expected was not built. website/support.js links to that name, so the download would 404. Check Tauri's bundler naming and update both."
              missing=1
            fi
          done <<< "$ASSETS"

          if [ "$missing" -ne 0 ]; then
            echo 'What was built:'
            find src-tauri/target -path '*/bundle/*' -type f | sed 's/^/  /'
            exit 1
          fi

  # Publishing is what tells people the release exists, so it happens last —
  # once every bundle is attached. If this never runs, the release sits there
  # as a draft with its assets and one click finishes it. That is the failure
  # this is shaped around.
  publish:
    name: Publish the release
    needs: [version, bundle]
    if: needs.version.outputs.releasing == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.id }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"draft":false}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /dev/null

          echo "::notice::Published $TAG."
