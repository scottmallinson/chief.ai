name: Release

on:
  push:
    branches: [main]
  # Re-runs the same flow by hand. With nothing releasable since the last tag
  # it is one Linux job that decides so and stops.
  workflow_dispatch:

concurrency:
  # Never cancelled, and never two at once: a release commits to main and moves
  # a tag, so a second merge waits for the first rather than racing it.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Matches CI. Not cosmetic: rust-cache hashes every `CARGO_*` and `RUST*`
# variable into its key, so a workflow that sets this and one that does not
# would look like different environments and never share a cache.
env:
  CARGO_TERM_COLOR: always

jobs:
  # One Linux job on every push to main. It decides whether what just landed is
  # worth releasing, and if it is, it is the release: the version is written
  # into the four files that carry it, the changelog gains an entry, both are
  # committed back to main and tagged, and a draft release is opened for the
  # bundles to attach to.
  version:
    name: Work out the release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      releasing: ${{ steps.decide.outputs.releasing }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      id: ${{ steps.draft.outputs.id }}
    steps:
      # Full history and tags: the script releases what has landed since the
      # last `v*` tag, and cannot see that in a shallow clone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No `pnpm install`: the script has no dependencies, so the runner's own
      # Node runs it and a release does not wait on a package manager.
      - name: Decide, and write the version in
        id: decide
        run: node scripts/release.mjs --write

      # Everything this repository publishes is the owner's work, whoever or
      # whatever typed it — a release commit included.
      - name: Commit and tag it
        id: commit
        if: steps.decide.outputs.releasing == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name 'Scott Mallinson'
          git config user.email 'scott@scottmallinson.com'

          git add package.json CHANGELOG.md src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(repo): release $VERSION"
          git tag "$TAG"

          # Pushed with GITHUB_TOKEN, which by design starts no further
          # workflow runs — so this commit does not set CI or this workflow off
          # again, and cannot loop.
          git push origin HEAD:main
          git push origin "$TAG"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A draft, so the tag's release exists for the bundles to attach to
      # without anyone being told about a release they cannot download yet.
      - name: Open the release
        id: draft
        if: steps.decide.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          NOTES: ${{ steps.decide.outputs.notes }}
          TARGET: ${{ steps.commit.outputs.sha }}
        run: |
          id=$(
            jq -n \
              --arg tag "$TAG" \
              --arg name "Chief $TAG" \
              --arg body "$NOTES" \
              --arg target "$TARGET" \
              '{tag_name: $tag, name: $name, body: $body, target_commitish: $target, draft: true}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" |
            jq -r '.id'
          )

          case "$id" in
            '' | null | *[!0-9]*)
              echo "::error::The release was not created, so there is nothing to attach bundles to."
              exit 1
              ;;
          esac

          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice::Drafted $TAG as release $id."

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.releasing == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      # The release commit, not whatever main has reached since: another pull
      # request merging mid-release must not change what ships.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      # A missing variable would silently produce a binary whose "Connect
      # GitHub" button never works, and nobody would find out until after they
      # had installed it. Checked before anything is compiled, so the matrix
      # fails in seconds rather than after four bundles.
      - name: Check the GitHub client id is configured
        shell: bash
        env:
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CHIEF_GITHUB_CLIENT_ID" ]; then
            echo "::error::CHIEF_GITHUB_CLIENT_ID is not set. Add it under Settings → Secrets and variables → Actions → Variables, or sign-in will be broken in this release."
            exit 1
          fi
          echo "Client id is configured (${#CHIEF_GITHUB_CLIENT_ID} characters)."

      # The same cache CI's app build writes from main, so a release starts
      # with Chief's dependencies already compiled instead of building the
      # whole tree from nothing. Only dependencies: rust-cache leaves the
      # workspace's own crates out, so Chief itself is always compiled here.
      - uses: ./.github/actions/setup-tauri
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          shared-key: tauri-${{ matrix.platform }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary so nobody has to configure anything to sign
          # in. A device-flow client id is not a secret, which is why this is a
          # repository variable rather than a secret.
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.version.outputs.id }}
          args: ${{ matrix.args }}

  # Publishing is what tells people the release exists, so it happens last —
  # once every bundle is attached. If this never runs, the release sits there
  # as a draft with its assets and one click finishes it. That is the failure
  # this is shaped around.
  publish:
    name: Publish the release
    needs: [version, bundle]
    if: needs.version.outputs.releasing == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.id }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"draft":false}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /dev/null

          echo "::notice::Published $TAG."
