name: Release

on:
  push:
    tags: ['v*']
  # Lets a release be cut from the Actions tab without pushing a tag first.
  # The draft release carries the tag, which GitHub creates when it is
  # published — so nothing is tagged until you decide to publish.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APT_OPTS: >-
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
        run: |
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y --no-install-recommends $APT_OPTS \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine is bundled, so it has to be on disk before Tauri builds. The
      # script is idempotent and pins the llama.cpp build.
      - name: Fetch the llama.cpp engine
        run: pnpm engine:fetch

      # A missing variable would silently produce a binary whose "Connect
      # GitHub" button never works, and nobody would find out until after they
      # had installed it.
      - name: Check the GitHub client id is configured
        shell: bash
        env:
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CHIEF_GITHUB_CLIENT_ID" ]; then
            echo "::error::CHIEF_GITHUB_CLIENT_ID is not set. Add it under Settings → Secrets and variables → Actions → Variables, or sign-in will be broken in this release."
            exit 1
          fi
          echo "Client id is configured (${#CHIEF_GITHUB_CLIENT_ID} characters)."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary so nobody has to configure anything to sign
          # in. A device-flow client id is not a secret, which is why this is a
          # repository variable rather than a secret.
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
        with:
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: 'Chief ${{ inputs.version || github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
