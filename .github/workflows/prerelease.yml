name: Pre-release

# A Windows installer built from whatever commit a `prerelease-*` tag points at,
# published as a GitHub pre-release. It never commits to main, never moves a
# version and never publishes as the latest release; it exists so a pull
# request can be installed and tried before it is merged.
on:
  push:
    tags: ['prerelease-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Bundle (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check the GitHub client id is configured
        shell: bash
        env:
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CHIEF_GITHUB_CLIENT_ID" ]; then
            echo "::error::CHIEF_GITHUB_CLIENT_ID is not set, so sign-in would be broken in this build."
            exit 1
          fi

      - uses: ./.github/actions/setup-tauri
        with:
          shared-key: tauri-windows-latest

      # The NSIS installer only: it is what a per-user install uses, and the
      # MSI is not needed to try a change.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHIEF_GITHUB_CLIENT_ID: ${{ vars.CHIEF_GITHUB_CLIENT_ID }}
          CHIEF_REQUIRE_CLIENT_ID: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Chief test build ${{ github.ref_name }}
          releaseBody: A Windows test build of an unmerged pull request. Not a release.
          releaseDraft: false
          prerelease: true
          args: --bundles nsis
