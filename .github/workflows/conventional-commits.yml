name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # A pull request is usually edited and pushed to in bursts, and only the
  # latest state of the title and the branch is worth linting.
  group: commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint PR title and commits
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      # The PR title becomes the squash-merge commit subject, so it has to be
      # a valid conventional commit.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm commitlint

      - name: Lint commits in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
