name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  # A pull request is usually edited and pushed to in bursts, and only the
  # latest state of the title and the branch is worth linting.
  group: commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint PR title and commits
    # Skipped on a draft for consistency with CI rather than for the money:
    # this is twenty seconds of Linux at 1x, against the two paid platforms
    # next door. The title is what CI lints and the title is what matters at
    # merge, so checking it from `ready_for_review` onwards loses nothing.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      # The title is not the release input — `scripts/release.mjs` reads the
      # branch's own commits with `--no-merges`, and a pull request here lands
      # as a merge commit rather than a squash, so the title never reaches it.
      # It is linted because it is what the pull request list, the merge
      # commit's body and every notification show, and a title that disagrees
      # with the commits under it is how somebody comes to believe a `chore`
      # title holds back a `feat` commit. The commits are linted in the next
      # step, and those are the ones that release.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm commitlint

      - name: Lint commits in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
