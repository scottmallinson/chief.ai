name: Bug report
description: Something in the app does not behave as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. …
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: ollama
    attributes:
      label: Ollama version and model
      description: Output of `ollama --version` and the model you are running, if relevant.
