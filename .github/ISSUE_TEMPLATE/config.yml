# Blank issues stay enabled: a question that fits neither template is still
# worth asking, and the alternative is somebody choosing the wrong template and
# leaving half of it empty.
blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/scottmallinson/chief.ai/security/advisories/new
    about: Privately, through GitHub's advisory form. Please do not open a public issue for one.
  - name: How to contribute
    url: https://github.com/scottmallinson/chief.ai/blob/main/CONTRIBUTING.md
    about: Setup, the checks to run before you push, and what review looks for.
