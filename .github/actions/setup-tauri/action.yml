name: Set up the Tauri toolchain
description: >-
  Everything a job needs before it can compile Chief: the WebKitGTK toolchain on
  Linux, Node and pnpm, a Rust toolchain with a warm cargo cache, and the
  bundled llama.cpp engine on disk. Shared by the Rust, App build and Release
  jobs, which otherwise repeat the same forty lines three times over.

inputs:
  components:
    description: Extra rustup components, comma separated (e.g. `rustfmt, clippy`).
    required: false
    default: ''
  targets:
    description: Extra rustup targets, comma separated.
    required: false
    default: ''
  engine-target:
    description: >-
      The Rust triple to fetch the llama.cpp engine for, when it is not this
      runner's own. A cross-compiling build needs the engine that matches what
      it is about to link, not the one that matches the machine it is on.
    required: false
    default: ''
  shared-key:
    description: >-
      A cargo cache key used instead of the automatic per-job one, so two jobs
      that compile the same thing share a cache. Both must agree on their
      `CARGO_*` and `RUST*` environment, which is hashed into the key.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # `xdg-utils` is the odd one out in a list that is otherwise toolchain and
    # -dev packages: the AppImage bundler copies the runner's own
    # `/usr/bin/xdg-open` into the bundle, and stops with
    # `xdg-open binary not found` when it is not there — after the whole crate
    # has been compiled in release, which is the expensive place to find out.
    #
    # `libvulkan1` is there for the same bundler and the same reason. The
    # engine's Vulkan backend links the Vulkan loader, linuxdeploy refuses an
    # AppDir holding a library whose dependencies it cannot resolve, and
    # nothing else in this list is guaranteed to pull the loader in. Chief
    # does not need it at run time: without it that one backend fails to
    # load and the engine runs on the CPU.
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        APT_OPTS: >-
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
      run: |
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y --no-install-recommends $APT_OPTS \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          patchelf \
          build-essential \
          file \
          libvulkan1 \
          xdg-utils

    - uses: ./.github/actions/setup-node

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.shared-key }}

    # Tauri's build script checks the bundled resource is on disk even for
    # `cargo check`/`clippy`/`test`, so every Rust job needs it. The script is
    # idempotent and pins the llama.cpp build, and it asks `rustc` for the host
    # triple — which is why it runs after the toolchain is installed.
    #
    # Twice, because a composite step has to name its shell and this is the one
    # place the choice matters. The script unpacks the Windows zip with `tar`,
    # counting on that being the bsdtar in System32; under Git Bash it is MSYS
    # tar instead, which reads `C:\Users\…` as a host:path and tries to open a
    # network connection to a machine called `C`.
    - name: Fetch the llama.cpp engine
      if: runner.os != 'Windows'
      shell: bash
      env:
        CHIEF_ENGINE_TARGET: ${{ inputs.engine-target }}
      run: pnpm engine:fetch

    - name: Fetch the llama.cpp engine
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CHIEF_ENGINE_TARGET: ${{ inputs.engine-target }}
      run: pnpm engine:fetch

    # Seconds here against minutes later. Tauri only notices a missing sidecar
    # part-way through its build script, so the first release to reach bundling
    # spent six macOS minutes compiling before it said
    # `resource path binaries/llama-server-x86_64-apple-darwin doesn't exist`.
    # On a runner billed at ten times Linux that is the most expensive possible
    # way to discover a file is not there.
    - name: Check the engine is on disk for the target being built
      shell: bash
      env:
        ENGINE_TARGET: ${{ inputs.engine-target }}
      run: |
        target="${ENGINE_TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
        case "$target" in *windows*) suffix=.exe ;; *) suffix= ;; esac
        sidecar="src-tauri/binaries/llama-server-$target$suffix"

        if [ ! -f "$sidecar" ]; then
          echo "::error::$sidecar is missing. Tauri's externalBin needs the engine named for the target being built, not for this runner."
          ls -la src-tauri/binaries || true
          exit 1
        fi

        echo "Engine present: $sidecar"
        file -b "$sidecar" || true
