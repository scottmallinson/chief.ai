[package]
name = "Chief"
version = "0.2.0"
description = "A privacy-first, on-device AI chief of staff."
authors = ["Scott Mallinson <scott@scottmallinson.com>"]
license = "MIT"
repository = "https://github.com/scottmallinson/chief.ai"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chief_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
thiserror = "2.0.20"
# Local calendar time, so the agent can resolve "last week" against the user's
# own clock rather than guessing. Already in the tree by way of Tauri.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "http2", "form", "query", "stream"] }
# `process` supervises the bundled llama.cpp server; `fs`/`io-util` stream the
# model file to disk while it downloads; `net` binds the loopback listener the
# OAuth redirect comes back to, and `macros` lets that listener watch for a new
# connection and an answer already in flight at the same time.
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# PKCE: SHA-256 for the code challenge, base64url for both halves, and the
# operating system's CSPRNG for the verifier and the state nonce.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[lints.rust]
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util"] }
